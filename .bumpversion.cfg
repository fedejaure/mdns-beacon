[bumpversion]
commit = True
tag = True
current_version = 1.0.1

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:src/mdns_beacon/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file(title):CHANGELOG.md]
search = {#}{#} [Unreleased]
replace = {#}{#} [Unreleased]
	
	{#}{#} [{new_version}] - {now:%Y-%m-%d}

[bumpversion:file(links):CHANGELOG.md]
search = [Unreleased]: https://github.com/fedejaure/mdns-beacon/compare/v{current_version}...main
replace = [Unreleased]: https://github.com/fedejaure/mdns-beacon/compare/v{new_version}...main
	[{new_version}]: https://github.com/fedejaure/mdns-beacon/compare/v{current_version}...v{new_version}

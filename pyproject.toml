[project]
name = "mdns-beacon"
version = "1.0.0"
description = "Multicast DNS (mDNS) Beacon to announce multiple CNAME aliases across your local network."
authors = [
    {name = "Federico Jaureguialzo", email = "fedejaure@gmail.com"}
]
readme = "README.md"
keywords = ["mdns-beacon", "mdns", "beacon", "avahi", "zeroconf", "bonjour"]
classifiers=[
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = "<3.13,>=3.10"
dependencies = [
  "click (>=8.1.8,<9.0.0)", 
  "zeroconf (>=0.146.1,<0.147.0)", 
  "rich (>=13.9.4,<14.0.0)", 
  "python-slugify (>=8.0.4,<9.0.0)", 
  "typing-extensions (>=4.12.2,<5.0.0)", 
  "click-option-group (>=0.5.6,<0.6.0)"
]

[project.urls]
homepage = "https://github.com/fedejaure/mdns-beacon"
repository = "https://github.com/fedejaure/mdns-beacon"
documentation = "https://mdns-beacon.readthedocs.io"
"Bug Tracker" = "https://github.com/fedejaure/mdns-beacon/issues"

[project.scripts]
mdns-beacon = 'mdns_beacon.cli.main:main'

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"
invoke = "^2.2.1"
bump2version = "^1.0.1"

[tool.poetry.group.linters.dependencies]
isort = "^7.0.0"
black = "^25.12.0"
ruff = "^0.14.6"

[tool.poetry.group.security.dependencies]
safety = "^3.7.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.4.1"
xdoctest = "^1.2.0"
coverage = {version = "^7.12.0", extras = ["toml"]}
pytest-cov = "^6.2.1"
pytest-asyncio = "^0.25.3"
pytest-mock = "^3.14.1"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.1.3"
recommonmark = "^0.7.1"
watchdog = {version = "^6.0.0", extras = ["watchmedo"]}

[tool.poetry.group.typing.dependencies]
mypy = "^1.19.1"
types-click = "^7.1.8"
types-python-slugify = "^8.0.2.20240310"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["mdns_beacon"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug",
  "if settings.DEBUG:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == __main__:"
]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py310"
output-format = "full"
line-length = 99
fix = true
extend-exclude = [
    "docs/*",
]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # flake8
  "C",  # mccabe
  "I",  # isort
  "N",  # pep8-naming
  "D",  # flake8-docstrings
  "ANN",  # flake8-annotations
  "S",  # flake8-bandit
  "BLE",  # flake8-blind-except
  "B",  # flake8-bugbear
  "A",  # flake8-builtins
  "G",  # flake8-logging-format
  "ERA",  # eradicate
  "ISC",  # flake8-implicit-str-concat
  "RUF",  # Ruff-specific rules
]
ignore = ["ANN101"]
unfixable = [
  "ERA",  # Don't remove commented-out code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/mdns_beacon/cli/types.py" = ["A005"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["mdns_beacon"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 99
known_third_party = ["invoke", "nox", "nox_poetry"]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:xdoctest.*:",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial",
]
norecursedirs = "tests/helpers"
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pytest.*", "invoke.*", "nox.*", "nox_poetry.*"]
allow_redefinition = false
check_untyped_defs = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = true
local_partial_types = true
strict_optional = true
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_unreachable = true
warn_no_return = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
